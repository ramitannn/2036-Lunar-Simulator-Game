</style></head><body>
<div id="game"><canvas id="c"></canvas>
<div id="top"><div id="hud"><div id="stats"></div><div id="btns"><button class="alt" id="sleep">END DAY</button><button class="alt" id="mute">SND ON</button><button class="alt" id="full">FULL</button></div></div><div id="alert" class="pn"></div></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
// ---------- audio
let AC,muted=false;
function beep(f,d=.12,t='square',v=.06,sl=0,at=0){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.linearRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const arp=(fs,ty='square',d=.12,s=.08)=>fs.forEach((f,i)=>beep(f,d,ty,.07,0,i*s));
const sfx={good:()=>arp([523,659,784,1047]),bad:()=>beep(150,.3,'sawtooth',.08,-80),alarm:()=>[0,.25,.5].forEach(t=>beep(880,.15,'square',.07,-300,t)),night:()=>arp([392,330,262],'triangle',.2,.15),morning:()=>arp([262,330,392,523],'triangle',.15,.1),blip:()=>beep(700,.04,'square',.03),drill:()=>beep(110+Math.random()*60,.08,'sawtooth',.07),plant:()=>beep(400,.1,'square',.06,300),sun:()=>beep(900,.08,'triangle',.07,500),tick:()=>beep(1200,.03,'square',.03)};
// ---------- NASA data
let storms=[{d:"6 Sep 2017",c:"X9.3",n:"the strongest flare of Solar Cycle 24"},{d:"28 Oct 2003",c:"X17",n:"one of the biggest flares ever seen"},{d:"14 May 2024",c:"X8.7",n:"a huge flare in the May 2024 storms"},{d:"7 Mar 2012",c:"X5.4",n:"a flare with a fast CME"}];
let dataMode="ARCHIVED NASA DONKI DATA (saved in game)";
try{fetch("https://api.nasa.gov/DONKI/FLR?startDate="+new Date(Date.now()-3e9).toISOString().slice(0,10)+"&api_key=DEMO_KEY").then(r=>r.json()).then(a=>{const m=a.filter(x=>/^[MX]/.test(x.classType||"")).slice(-4).map(x=>({d:x.beginTime.slice(0,10),c:x.classType,n:"a real flare from NASA’s feed"}));if(m.length){storms=m;dataMode="LIVE NASA DONKI DATA"}}).catch(()=>{})}catch(e){}
// ---------- icons
const IC={pw:["....##..","...##...","..##....",".######.","....##..","...##...","..##....",".##....."],ice:["...##...","..####..",".######.","########",".######.","..####..","...##...","........"],fd:[".######.","########","####.###","########","#.######",".#######","..#####.","........"],hp:[".##..##.","########","########","########",".######.","..####..","...##...","........"]};
const COL={pw:"#ffd23f",ice:"#4fd0ff",fd:"#6be675",hp:"#ff5470"},ICU={};IC.tk=[".######.","########","########","########",".######.","...##...","..#.....","........"];COL.tk="#ffffff";
const ico=k=>{icon(k);return '<img class=ii src="'+ICU[k]+'">'};
const HM={power:['pw','y'],pwr:['pw','y'],ice:['ice','c'],food:['fd','g'],potato:['fd','g'],potatoes:['fd','g'],storm:[0,'r2'],radiation:[0,'r2'],shield:[0,'c'],health:['hp','r2']};
function hl(h){return h.split(/(<[^>]+>)/).map((x,i)=>i%2?x:x.replace(/\b(power|pwr|ice|food|potatoes|potato|storm|radiation|shield|health)\b/gi,m=>{const q=HM[m.toLowerCase()];return `<span class=${q[1]}>${q[0]?ico(q[0]):''}${m}</span>`})).join('')}
function icon(k){if(!ICU[k]){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.fillStyle=COL[k];IC[k].forEach((r,y)=>[...r].forEach((p,i)=>p=='#'&&x.fillRect(i,y,1,1)));ICU[k]=c.toDataURL()}return `<img src="${ICU[k]}" style="image-rendering:pixelated">`}
// ---------- state
const MAX=12,DAYS=14,APD=3,NEED={pw:2,ice:1,fd:1};
let S,M='world',MG=null,Z=3,LW=427,LH=240,ox=0,oy=0;const P={x:200,y:140,f:'down'};
const B=[
{id:"hab",n:"HABITAT",w:60,h:40,fx:.26,fy:.3,tip:"Your home! Go inside: sleep, chat with the crew, use the telescope."},
{id:"ice",n:"ICE STATION",w:56,h:42,fx:.17,fy:.64,tip:"MINIGAME: drill rock to find ice. Costs 2 power. Ice makes water + air."},
{id:"farm",n:"POTATO DOME",w:52,h:44,fx:.5,fy:.38,tip:"MINIGAME: plant potatoes. Costs 2 power + 1 ice for water."},
{id:"rov",n:"SUN ROVER",w:48,h:34,fx:.83,fy:.34,tip:"MINIGAME: drive to the sunny peak and grab sun. FREE to start!"},
{id:"sh",n:"SHIELD",w:48,h:34,fx:.52,fy:.72,tip:"Costs 2 power. Blocks the next solar storm (radiation)."},
{id:"comm",n:"MALAPERT COMMS",w:60,h:40,fx:.915,fy:.62,tip:"Mons Malapert relay: talk to Mission Control on Earth."}];
function layout(){B.forEach(b=>{b.x=Math.round(LW*b.fx-b.w/2);b.y=Math.round(LH*b.fy-b.h/2)})}
function newGame(){const st=new Set();while(st.size<3)st.add(3+Math.floor(Math.random()*(DAYS-4)));S={day:1,ap:APD,pw:8,ice:3,fd:3,hp:10,shield:false,sd:{},over:false,busy:false};[...st].forEach((d,i)=>S.sd[d]=storms[i%storms.length]);P.x=LW*.5;P.y=LH*.6;M='world';$('#game').classList.remove('mg');say("Welcome to Mons Mouton, near the Moon’s south pole! You get 3 actions a day. Walk to a building and press USE.<br>"+dataMode);hud()}
const FACTS=["A Moon night lasts about 14 Earth days. Solar panels need sunny peaks!","Radiation is invisible energy from the Sun. Thick walls and moon dust block it.","Water ice can be split to make oxygen to breathe.","Signals from Earth take about 1.3 seconds to reach the Moon.","Scientists have grown potatoes in Mars-like soil. Real space farming!","A big solar flare reaches the Moon in about 8 minutes. Alerts matter!"];
function say(m){$('#log').innerHTML=hl(m)}
function hud(){const st=(k,l,v,m,n)=>{const w=n&&v<=n,tx=!n?'&nbsp;':v<n?'NOT ENOUGH!':v==n?'ZERO TONIGHT!':'NIGHT USES '+n;return `<div class="st pn ${w?'low':''}"><div class=r>${icon(k)}<span>${l}</span><b>${v}/${m}</b></div><div class=bar><i style="width:${v/m*100}%;background:${COL[k]}"></i></div><div class=nd>${tx}</div></div>`};
$('#stats').innerHTML=`<div class="st pn"><div class=r><span>DAY</span><b>${S.day}/${DAYS}</b></div><div class=bar><i style="width:${S.day/DAYS*100}%;background:#b9a6ff"></i></div><div class=nd>ACTIONS ${[...Array(APD)].map((_,i)=>`<span class="pip ${i<S.ap?'on':''}"></span>`).join('')}</div></div>`+st('pw','PWR',S.pw,MAX,NEED.pw)+st('ice','ICE',S.ice,MAX,NEED.ice)+st('fd','FOOD',S.fd,MAX,NEED.fd)+st('hp','HP',S.hp,10,0)+`<div class="st pn"><div class=r><span>SHIELD</span></div><div class=nd style="color:${S.shield?'var(--ice)':'var(--mut)'}">${S.shield?'READY':'NONE'}</div></div>`;
const L=[],a=$('#alert'),stn=S.sd[S.day+1],now=S.sd[S.day];
if(stn&&!S.shield)L.push("STORM TOMORROW! NASA: a "+stn.c+" flare on "+stn.d+" ("+stn.n+"). Get the SHIELD!");else if(now&&!S.shield)L.push("STORM TONIGHT! No shield = radiation damage!");
if(S.pw<NEED.pw)L.push("LOW POWER: night needs "+NEED.pw+", you have "+S.pw+". Use the SUN ROVER (free)!");
if(S.ice<NEED.ice)L.push("LOW ICE: night needs "+NEED.ice+". Go to the ICE STATION!");
if(S.fd<NEED.fd)L.push("LOW FOOD: night needs "+NEED.fd+". Go to the POTATO DOME!");
a.style.display=L.length&&!S.over?'block':'none';a.className='pn'+((stn||now)&&!S.shield?' storm':'');a.innerHTML=hl(L.join('<br>'));
if(stn&&!S.shield&&!hud.w)sfx.alarm();hud.w=!!(stn&&!S.shield)}
// ---------- actions
function startMG(b){if(b.id=='comm'&&M=='world'&&!S.busy&&!S.over)return talk('MISSION CONTROL',commL());if(b.id=='hab'&&M=='world'&&!S.busy&&!S.over)return enter();if(S.over||S.busy||S.ap<=0||M!='world')return;const id=b.id;
if(id=='sh'){if(S.shield)return say("Shield is already ready!");if(S.pw<2){sfx.bad();return say("Need 2 power. Drive the SUN ROVER first, it is free!")}S.pw-=2;S.shield=true;S.ap--;sfx.good();pop(b.x+b.w/2-20,b.y-8,"SHIELD UP");say("Shield ready. It will block the next solar storm. Cost: 2 power.");hud();return after()}
if((id=='ice'||id=='farm')&&S.pw<2){sfx.bad();return say("Need 2 power! Drive the SUN ROVER: it costs nothing and brings power.")}
if(id=='farm'&&S.ice<1){sfx.bad();return say("Need 1 ice for water! Mine at the ICE STATION first.")}
if(id=='ice')S.pw-=2;if(id=='farm'){S.pw-=2;S.ice--}
PT=[];M=id;sfx.tick();$('#game').classList.add('mg');
if(id=='ice'){MG={rd:2.6,t:9,found:0,dr:{x:160,y:90},act:0,tl:[...Array(15)].map(()=>({hp:2,ice:0,open:0}))};[...Array(15).keys()].sort(()=>Math.random()-.5).slice(0,4).forEach(i=>MG.tl[i].ice=1)}
if(id=='farm')MG={rd:2.6,t:8,n:0,pl:Array(12).fill(0),ax:160,ay:186,go:null};
if(id=='rov')MG={rd:2.6,t:12,lane:1,px:160,ob:[],got:0,hit:0,sp:0,shk:0};
hud()}
function endMG(){let gain,m;const id=M;
if(id=='ice'){gain=MG.found;S.ice=Math.min(MAX,S.ice+gain);m="Drilled "+gain+" ice (cost 2 power)."}
if(id=='farm'){gain=Math.max(1,Math.round(MG.n/3));S.fd=Math.min(MAX,S.fd+gain);m="Planted "+MG.n+" potatoes = "+gain+" food (cost 2 power, 1 ice)."}
if(id=='rov'){gain=Math.max(1,MG.got);S.pw=Math.min(MAX,S.pw+gain);m="Rover collected "+MG.got+" sun. +"+gain+" power (cost: nothing!)."}
const b=B.find(x=>x.id==id);M='world';$('#game').classList.remove('mg');S.ap--;gain>0?sfx.good():sfx.bad();pop(b.x+b.w/2-8,b.y-6,"+"+gain);say(m);hud();after()}
function after(){if(S.ap<=0)setTimeout(endDay,1000)}
function endDay(){if(S.over||S.busy)return;S.busy=true;sfx.night();const r=[];
const used="NIGHT REPORT: life support used "+NEED.pw+" power, crew used "+NEED.ice+" ice and "+NEED.fd+" food.";
S.pw-=NEED.pw;S.ice-=NEED.ice;S.fd-=NEED.fd;let dmg=0;
if(S.pw<0){S.pw=0;dmg++;r.push("No power! Heaters off. -1 health.")}if(S.ice<0){S.ice=0;dmg+=2;r.push("No water or air! -2 health.")}if(S.fd<0){S.fd=0;dmg++;r.push("No food! -1 health.")}
const st=S.sd[S.day];if(st){if(S.shield){S.shield=false;r.push("The shield blocked the "+st.c+" radiation storm. Safe!")}else{dmg+=3;r.push("Radiation storm hit with no shield! -3 health.")}}
S.hp-=dmg;if(dmg)sfx.bad();say(used+"<br>"+r.join("<br>"));hud();
setTimeout(()=>{if(S.hp<=0)return finish(false);if(S.day>=DAYS)return finish(true);S.day++;S.ap=APD;S.busy=false;sfx.morning();say("DAY "+S.day+": "+FACTS[S.day%FACTS.length]);hud()},2400)}
function finish(win){S.over=true;S.busy=false;hud();const s=!win?0:S.hp>=8?3:S.hp>=5?2:1;win?sfx.good():sfx.bad();
show("<h2>"+(win?"MISSION COMPLETE!":"MISSION ENDED")+"</h2><p>"+(win?"Your crew survived "+DAYS+" days on the Moon!":"The base ran out of supplies on day "+S.day+".")+"</p><p style='font-size:20px;color:var(--pw)'>"+"★".repeat(s)+"<span style='color:#444'>"+"★".repeat(3-s)+"</span></p><p>WHAT YOU LEARNED: power, water and food are linked. Every action costs something, and safety (the shield) costs power today. Real mission planners balance this too, using space weather data from NASA.</p><button id='go'>PLAY AGAIN</button> <button class='alt' id='mm'>MAIN MENU</button>");$('#go').onclick=()=>{hideOv();newGame()};$('#mm').onclick=goMenu}
function show(h){$('#ovc').innerHTML=h;$('#ov').style.display='flex'}function hideOv(){$('#ov').style.display='none'}
function howTo(){show(`<h2>HOW TO PLAY</h2><p>Keep your crew alive for 14 days at the Moon’s south pole.</p><p>ICE STATION: drill ice. POTATO DOME: plant food. SUN ROVER: dodge rocks, grab sun (free!). SHIELD: stops solar storms. HABITAT: sleep, talk to the crew, use the telescope.</p><p>You get <b>3 actions a day</b>. Each night uses 2 power, 1 ice, 1 food. Warnings show what runs low.</p><p>Move: arrows / WASD / pad. USE: E, Space or button.</p><p style="color:var(--mut);font-size:.8em">NASA data: storms use real flare dates from NASA DONKI. LCROSS (2009) found water ice in dark craters.</p><button id=st>OK</button>`);$('#st').onclick=hideOv}
function goMenu(){M='menu';DLG=null;$('#game').classList.add('menu');$('#game').classList.remove('mg');$('#menu').style.display='flex';hideOv()}
function startGame(){$('#game').classList.remove('menu');$('#menu').style.display='none';newGame();sfx.morning();try{AC&&AC.resume()}catch(e){}}
$('#mstart').onclick=startGame;$('#mhow').onclick=howTo;
$('#sleep').onclick=()=>{trySleep()};$('#mute').onclick=$('#mmute').onclick=()=>{muted=!muted;$('#mute').textContent="SND "+(muted?"OFF":"ON");$('#mmute').textContent="SOUND: "+(muted?"OFF":"ON")};
$('#full').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
// ---------- input
const K={},map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
function lane(k){if(M=='rov'&&MG&&!(MG.rd>0)&&MG.t>0){if(k=='left'&&MG.lane>0){MG.lane--;sfx.blip()}if(k=='right'&&MG.lane<2){MG.lane++;sfx.blip()}}}
addEventListener('keydown',e=>{const k=map[e.key];if(k){if(!K[k])lane(k);K[k]=1;e.preventDefault()}if(e.key=='e'||e.key==' '){e.preventDefault();use()}});
addEventListener('keyup',e=>{const k=map[e.key];if(k)K[k]=0});
document.querySelectorAll('#dpad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{K[k]=1;lane(k);e.preventDefault()};['pointerup','pointerleave','pointercancel'].forEach(ev=>b['on'+ev]=()=>K[k]=0)});
let near=null,DLG=null;$('#prompt').onclick=()=>use();
const tp=i=>({x:76+(i%5)*48,y:50+(i/5|0)*42}),fp=i=>({x:44+(i%4)*60,y:52+(i/4|0)*40});
cv.addEventListener('pointerdown',e=>{if(M=='scope')return use();const r=cv.getBoundingClientRect(),q=cv.width/r.width/Z,x=(e.clientX-r.left)*q-ox,y=(e.clientY-r.top)*q-oy;
if((M=='ice'||M=='farm'||M=='rov')&&(MG.rd>0||MG.t<=0))return;
if(M=='ice'){MG.dr={x,y};MG.act=.3;sfx.drill();MG.tl.forEach((t,i)=>{const p=tp(i);if(!t.open&&x>p.x&&x<p.x+44&&y>p.y&&y<p.y+38){MG.tg=i;t.hp--;t.sh=.2;burst(p.x+22,p.y+19,'#9a9aae',6,50);if(t.hp<=0){t.open=1;burst(p.x+22,p.y+19,t.ice?'#bff0ff':'#777',t.ice?14:8,70);if(t.ice){MG.found++;sfx.sun();pop(p.x+8,p.y+10,"ICE!")}}}})}
if(M=='farm'){MG.pl.forEach((v,i)=>{const p=fp(i);if(!v&&x>p.x&&x<p.x+52&&y>p.y&&y<p.y+32){MG.pl[i]={age:0};MG.n++;MG.go={x:p.x+26,y:p.y+37};sfx.plant();burst(p.x+26,p.y+18,'#8a5a3a',7,40)}})}
if(M=='rov')lane(x<160?'left':'right')});
// ---------- art helpers
